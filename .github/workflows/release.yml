name: Release Chatroom
'on':
  push:
    branches:
    - master
    paths:
    - VERSION
    - go-server/VERSION
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: release-chatroom-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          suffix: .exe
        - os: ubuntu-latest
          suffix: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: 1.24.5
        cache-dependency-path: go-server/go.sum
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install Python client dependencies
      run: python -m pip install -r requirements.txt
    - name: Static checks
      working-directory: go-server
      run: go vet ./...
    - name: Windows Go regression tests
      if: runner.os == 'Windows'
      working-directory: go-server
      run: go test -count=1 ./...
    - name: Linux Go regression and race tests
      if: runner.os == 'Linux'
      working-directory: go-server
      run: go test -race -count=1 ./...
    - name: Build native interoperability test server
      working-directory: go-server
      shell: bash
      run: go build -o "${{ github.workspace }}/go-interop-server${{ matrix.suffix }}" ./cmd/server
    - name: Install Linux GUI test dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
    - name: Run Python regression and Go interoperability tests
      if: runner.os == 'Windows'
      env:
        CHATROOM_GO_SERVER_EXE: ${{ github.workspace }}/go-interop-server${{ matrix.suffix }}
        PYTHONIOENCODING: utf-8
      run: python -m unittest discover -s tests -v
    - name: Run Python regression and Go interoperability tests
      if: runner.os == 'Linux'
      env:
        CHATROOM_GO_SERVER_EXE: ${{ github.workspace }}/go-interop-server${{ matrix.suffix }}
        PYTHONIOENCODING: utf-8
      run: xvfb-run -a python -m unittest discover -s tests -v
  build-python:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          platform: windows
          suffix: .exe
        - os: ubuntu-latest
          platform: linux
          suffix: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install dependencies
      run: python -m pip install -r requirements.txt pyinstaller
    - name: Install Linux GUI runtime dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y python3-tk
    - name: Build server
      run: pyinstaller --onefile --clean --name server-${{ matrix.platform }} server.py
    - name: Build client
      run: pyinstaller --onefile --windowed --clean --name client-${{ matrix.platform }} client.py
    - uses: actions/upload-artifact@v4
      with:
        name: release-python-${{ matrix.platform }}
        path: |
          dist/server-${{ matrix.platform }}${{ matrix.suffix }}
          dist/client-${{ matrix.platform }}${{ matrix.suffix }}
        if-no-files-found: error
    needs: tests
  build-go:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - goos: windows
          goarch: amd64
          suffix: .exe
        - goos: windows
          goarch: arm64
          suffix: .exe
        - goos: linux
          goarch: amd64
          suffix: ''
        - goos: linux
          goarch: arm64
          suffix: ''
        - goos: darwin
          goarch: amd64
          suffix: ''
        - goos: darwin
          goarch: arm64
          suffix: ''
    env:
      GOTOOLCHAIN: local
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: 1.24.5
        cache-dependency-path: go-server/go.sum
    - name: Build platform binary
      working-directory: go-server
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: '0'
      shell: bash
      run: |
        version=$(tr -d '\r\n' < VERSION)
        mkdir -p ../release-assets
        go build -trimpath -ldflags="-s -w -X main.version=$version" \
          -o "../release-assets/go-server-${GOOS}-${GOARCH}${{ matrix.suffix }}" ./cmd/server
    - uses: actions/upload-artifact@v4
      with:
        name: release-go-${{ matrix.goos }}-${{ matrix.goarch }}
        path: release-assets/*
        if-no-files-found: error
  publish:
    needs:
    - build-python
    - build-go
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release-assets
        merge-multiple: true
    - name: Publish versioned release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        tag=$(tr -d '\r\n' < VERSION)
        go_tag=$(tr -d '\r\n' < go-server/VERSION)
        [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$tag" == "$go_tag" ]]
        for binary in client-windows.exe server-windows.exe client-linux server-linux go-server-windows-amd64.exe go-server-windows-arm64.exe go-server-linux-amd64 go-server-linux-arm64 go-server-darwin-amd64 go-server-darwin-arm64; do
          test -s "release-assets/$binary"
        done
        git archive --format=zip --output="release-assets/chatroom-${tag}-source.zip" HEAD
        cp client.py server.py requirements.txt release-assets/
        (cd release-assets && sha256sum client-* server-* go-server-* "chatroom-${tag}-source.zip" client.py server.py requirements.txt > SHA256SUMS)
        gh release create "$tag" release-assets/* \
          --target "$GITHUB_SHA" --title "$tag — Python 客户端与双服务端" \
          --notes-file RELEASE_NOTES.md --latest
