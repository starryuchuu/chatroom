name: Release Chatroom
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or retry (vX.Y.Z)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: chatroom-release
  cancel-in-progress: false
env:
  PRIVACY_FORBIDDEN_VALUES_JSON: ${{ secrets.PRIVACY_FORBIDDEN_VALUES_JSON }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate release tag and all version copies
        id: plan
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: python scripts/release_plan.py
      - name: Check release source privacy
        run: python scripts/check_release_privacy.py --require-alias-head
      - name: Validate reviewed release notes
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: python scripts/release_notes.py "$RELEASE_TAG" --output release-notes.md
  tests:
    needs: validate
    uses: ./.github/workflows/tests.yml
    with:
      full: true
      ref: ${{ needs.validate.outputs.commit }}
    secrets: inherit
  build:
    needs: [validate, tests]
    uses: ./.github/workflows/build-artifacts.yml
    with:
      release: true
      ref: ${{ needs.validate.outputs.commit }}
    secrets: inherit
  publish:
    needs: [validate, tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Prepare source archive and checksums
        run: python scripts/release_assets.py
      - name: Check final release privacy
        run: python scripts/check_release_privacy.py --require-alias-head --assets release-assets
      - name: Prepare reviewed release notes
        run: python scripts/release_notes.py "$RELEASE_TAG" --output release-notes.md
      - name: Publish existing validated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TITLE=$(head -n 1 release-notes.md)
          RELEASE_TITLE=${RELEASE_TITLE#\# }
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
            --title "$RELEASE_TITLE" --notes-file release-notes.md --latest
