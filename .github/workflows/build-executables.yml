name: Build Executables

"on":
  push:
    branches: [ main, master, test ]
  pull_request:
    branches: [ main, master, test ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== Python ====================
  build-python-windows:
    name: Build Python (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build server (EXE)
        run: pyinstaller --onefile --clean --name server server.py

      - name: Build client (EXE)
        run: pyinstaller --onefile --windowed --clean --name client client.py

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-server-windows
          path: dist/server.exe
          if-no-files-found: error

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-client-windows
          path: dist/client.exe
          if-no-files-found: error

  build-python-linux:
    name: Build Python (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build server
        run: pyinstaller --onefile --clean --name server server.py

      - name: Build client
        run: pyinstaller --onefile --clean --name client client.py

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-server-linux
          path: dist/server
          if-no-files-found: error

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-client-linux
          path: dist/client
          if-no-files-found: error

  # ==================== Go ====================
  build-go-windows:
    name: Build Go Server (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod 要求 go 1.23.0 + toolchain go1.24.5，必须使用 1.24.5 及以上版本
          go-version: '1.24.5'
          cache: true

      - name: Run Go tests
        working-directory: go-server
        run: go test ./...

      - name: Build server (EXE)
        working-directory: go-server
        run: go build -o server.exe ./cmd/server/main.go

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-server-windows
          path: go-server/server.exe
          if-no-files-found: error

  build-go-cross-platform:
    name: Build Go Server (Cross-platform)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod 要求 go 1.23.0 + toolchain go1.24.5，必须使用 1.24.5 及以上版本
          go-version: '1.24.5'
          cache: true

      - name: Build for Windows (amd64)
        working-directory: go-server
        run: GOOS=windows GOARCH=amd64 go build -o server-windows-amd64.exe ./cmd/server/main.go

      - name: Build for Linux (amd64)
        working-directory: go-server
        run: GOOS=linux GOARCH=amd64 go build -o server-linux-amd64 ./cmd/server/main.go

      - name: Build for macOS (amd64)
        working-directory: go-server
        run: GOOS=darwin GOARCH=amd64 go build -o server-darwin-amd64 ./cmd/server/main.go

      - name: Build for Windows (arm64)
        working-directory: go-server
        run: GOOS=windows GOARCH=arm64 go build -o server-windows-arm64.exe ./cmd/server/main.go

      - name: Build for Linux (arm64)
        working-directory: go-server
        run: GOOS=linux GOARCH=arm64 go build -o server-linux-arm64 ./cmd/server/main.go

      - name: Build for macOS (arm64)
        working-directory: go-server
        run: GOOS=darwin GOARCH=arm64 go build -o server-darwin-arm64 ./cmd/server/main.go

      - name: Upload cross-platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-server-cross-platform
          path: |
            go-server/server-windows-amd64.exe
            go-server/server-linux-amd64
            go-server/server-darwin-amd64
            go-server/server-windows-arm64.exe
            go-server/server-linux-arm64
            go-server/server-darwin-arm64
          if-no-files-found: error
