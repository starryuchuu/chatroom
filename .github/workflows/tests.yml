name: Regression tests

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      full:
        type: boolean
        default: true
      go_checks:
        type: boolean
        default: false
      opaque_checks:
        type: boolean
        default: false

permissions:
  contents: read

env:
  PRIVACY_FORBIDDEN_VALUES_JSON: ${{ secrets.PRIVACY_FORBIDDEN_VALUES_JSON }}

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.full && fromJSON('["windows-latest","ubuntu-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: go-server/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python dependency advisories
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --disable-pip --no-deps -r requirements-build.txt
      - name: Check Go dependency advisories
        if: runner.os == 'Linux' && (inputs.full || inputs.go_checks)
        working-directory: go-server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/server
      - name: Rebuild shared OPAQUE core from locked sources
        if: runner.os == 'Linux' && (inputs.full || inputs.opaque_checks)
        run: |
          python scripts/build_opaque.py
          git diff --exit-code -- chatroom_client/opaque_core.wasm go-server/internal/opaqueauth/opaque_core.wasm
      - name: Go static checks
        if: inputs.full || inputs.go_checks
        working-directory: go-server
        run: go vet ./...
      - name: Go regression tests on Windows
        if: runner.os == 'Windows'
        working-directory: go-server
        run: go test -count=1 ./...
      - name: Go regression and race tests on Linux
        if: runner.os == 'Linux' && (inputs.full || inputs.go_checks)
        working-directory: go-server
        run: go test -race -count=1 ./...
      - name: Build interoperability test server
        working-directory: go-server
        shell: bash
        run: go build -o "${{ github.workspace }}/go-interop-server${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/server
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk fonts-noto-cjk
      - name: Python and Go interoperability tests on Windows
        if: runner.os == 'Windows'
        env:
          CHATROOM_GO_SERVER_EXE: ${{ github.workspace }}/go-interop-server${{ runner.os == 'Windows' && '.exe' || '' }}
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
      - name: Python and Go interoperability tests on Linux
        if: runner.os == 'Linux'
        env:
          CHATROOM_GO_SERVER_EXE: ${{ github.workspace }}/go-interop-server${{ runner.os == 'Windows' && '.exe' || '' }}
          PYTHONIOENCODING: utf-8
        run: xvfb-run -a python -m unittest discover -s tests -v
